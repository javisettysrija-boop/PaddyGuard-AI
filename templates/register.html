{% extends "base.html" %}

{% block title %}Register - PaddyGuard AI{% endblock %}

{% block content %}

<div class="container">

    <div class="row justify-content-center">

        <div class="col-md-7 col-lg-6">

            <div class="card shadow border-0 my-5">

                <div class="card-body p-5">

                    <!-- Header -->
                    <div class="text-center mb-4">

                        <div class="display-5 text-success">
                            <i class="bi bi-person-plus"></i>
                        </div>

                        <h2 class="fw-bold mt-2">
                            <span data-i18n="create_account">
                                Create Account
                            </span>
                        </h2>

                        <p class="text-muted">
                            <span data-i18n="register_subtitle">
                                Register to use PaddyGuard AI
                            </span>
                        </p>

                    </div>


                    <!-- Registration Form -->
                    <form
                        method="POST"
                        action="{{ url_for('register') }}"
                        id="registerForm"
                    >

                        <!-- Username -->
                        <div class="mb-3">

                            <label
                                for="username"
                                class="form-label fw-semibold"
                            >
                                <span data-i18n="username">
                                    Username
                                </span>
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    <i class="bi bi-person"></i>
                                </span>

                                <input
                                    type="text"
                                    name="username"
                                    id="username"
                                    class="form-control"
                                    placeholder="Enter username"
                                    minlength="3"
                                    required
                                >

                            </div>

                        </div>


                        <!-- Email -->
                        <div class="mb-3">

                            <label
                                for="email"
                                class="form-label fw-semibold"
                            >
                                <span data-i18n="email">
                                    Email
                                </span>
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    <i class="bi bi-envelope"></i>
                                </span>

                                <input
                                    type="email"
                                    name="email"
                                    id="email"
                                    class="form-control"
                                    placeholder="Enter email"
                                    required
                                >

                            </div>

                        </div>


                        <!-- Password -->
                        <div class="mb-3">

                            <label
                                for="registerPassword"
                                class="form-label fw-semibold"
                            >
                                <span data-i18n="password">
                                    Password
                                </span>
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    <i class="bi bi-lock"></i>
                                </span>

                                <input
                                    type="password"
                                    name="password"
                                    id="registerPassword"
                                    class="form-control"
                                    placeholder="Create password"
                                    minlength="6"
                                    required
                                >

                                <button
                                    type="button"
                                    class="btn btn-outline-secondary"
                                    onclick="toggleRegisterPassword()"
                                >
                                    <i
                                        class="bi bi-eye"
                                        id="registerPasswordIcon"
                                    ></i>
                                </button>

                            </div>

                        </div>


                        <!-- Confirm Password -->
                        <div class="mb-4">

                            <label
                                for="confirmPassword"
                                class="form-label fw-semibold"
                            >
                                <span data-i18n="confirm_password">
                                    Confirm Password
                                </span>
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    <i class="bi bi-lock-fill"></i>
                                </span>

                                <input
                                    type="password"
                                    name="confirm_password"
                                    id="confirmPassword"
                                    class="form-control"
                                    placeholder="Confirm password"
                                    minlength="6"
                                    required
                                >

                                <button
                                    type="button"
                                    class="btn btn-outline-secondary"
                                    onclick="toggleConfirmPassword()"
                                >
                                    <i
                                        class="bi bi-eye"
                                        id="confirmPasswordIcon"
                                    ></i>
                                </button>

                            </div>

                            <div
                                id="passwordMatchMessage"
                                class="small mt-2"
                            ></div>

                        </div>


                        <!-- Terms -->
                        <div class="form-check mb-4">

                            <input
                                class="form-check-input"
                                type="checkbox"
                                name="terms"
                                id="terms"
                                required
                            >

                            <label
                                class="form-check-label"
                                for="terms"
                            >
                                <span data-i18n="agree_terms">
                                    I agree to the terms and conditions
                                </span>
                            </label>

                        </div>


                        <!-- Register Button -->
                        <button
                            type="submit"
                            class="btn btn-success w-100 py-2"
                            id="registerButton"
                        >

                            <i class="bi bi-person-plus"></i>

                            <span data-i18n="register">
                                Register
                            </span>

                        </button>

                    </form>


                    <!-- Login Link -->
                    <div class="text-center mt-4">

                        <p class="mb-0">

                            <span data-i18n="already_account">
                                Already have an account?
                            </span>

                            <a
                                href="{{ url_for('login') }}"
                                class="text-success fw-semibold"
                            >
                                <span data-i18n="login">
                                    Login
                                </span>
                            </a>

                        </p>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}


{% block scripts %}

<script>

/* =========================================================
   TOGGLE REGISTER PASSWORD
   ========================================================= */

function toggleRegisterPassword() {

    const password =
        document.getElementById("registerPassword");

    const icon =
        document.getElementById("registerPasswordIcon");

    if (password.type === "password") {

        password.type = "text";

        icon.classList.remove("bi-eye");

        icon.classList.add("bi-eye-slash");

    } else {

        password.type = "password";

        icon.classList.remove("bi-eye-slash");

        icon.classList.add("bi-eye");

    }

}


/* =========================================================
   TOGGLE CONFIRM PASSWORD
   ========================================================= */

function toggleConfirmPassword() {

    const password =
        document.getElementById("confirmPassword");

    const icon =
        document.getElementById("confirmPasswordIcon");

    if (password.type === "password") {

        password.type = "text";

        icon.classList.remove("bi-eye");

        icon.classList.add("bi-eye-slash");

    } else {

        password.type = "password";

        icon.classList.remove("bi-eye-slash");

        icon.classList.add("bi-eye");

    }

}


/* =========================================================
   PASSWORD MATCH CHECK
   ========================================================= */

const registerForm =
    document.getElementById("registerForm");

const registerPassword =
    document.getElementById("registerPassword");

const confirmPassword =
    document.getElementById("confirmPassword");

const passwordMatchMessage =
    document.getElementById("passwordMatchMessage");


function checkPasswordMatch() {

    if (
        confirmPassword.value === ""
    ) {

        passwordMatchMessage.textContent = "";

        return;

    }


    if (
        registerPassword.value ===
        confirmPassword.value
    ) {

        passwordMatchMessage.textContent =
            "Passwords match.";

        passwordMatchMessage.className =
            "small mt-2 text-success";

        confirmPassword.classList.remove(
            "is-invalid"
        );

        confirmPassword.classList.add(
            "is-valid"
        );

    } else {

        passwordMatchMessage.textContent =
            "Passwords do not match.";

        passwordMatchMessage.className =
            "small mt-2 text-danger";

        confirmPassword.classList.remove(
            "is-valid"
        );

        confirmPassword.classList.add(
            "is-invalid"
        );

    }

}


registerPassword.addEventListener(
    "input",
    checkPasswordMatch
);


confirmPassword.addEventListener(
    "input",
    checkPasswordMatch
);


/* =========================================================
   FORM VALIDATION
   ========================================================= */

registerForm.addEventListener(
    "submit",
    function(event) {

        const username =
            document.getElementById("username").value.trim();

        const email =
            document.getElementById("email").value.trim();

        const password =
            registerPassword.value;

        const confirm =
            confirmPassword.value;

        const terms =
            document.getElementById("terms").checked;


        if (username.length < 3) {

            event.preventDefault();

            alert(
                "Username must contain at least 3 characters."
            );

            return;

        }


        if (password.length < 6) {

            event.preventDefault();

            alert(
                "Password must contain at least 6 characters."
            );

            return;

        }


        if (password !== confirm) {

            event.preventDefault();

            alert(
                "Passwords do not match."
            );

            return;

        }


        if (!terms) {

            event.preventDefault();

            alert(
                "Please accept the terms and conditions."
            );

            return;

        }

    }
);

</script>

{% endblock %}
