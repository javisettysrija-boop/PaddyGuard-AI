{% extends "base.html" %}


{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card shadow">

            <div class="card-body">

                <h2 class="text-center">
                    Create Account
                </h2>

                <form method="POST">


                    <div class="mb-3">

                        <label class="form-label">
                            Name
                        </label>

                        <input
                            type="text"
                            name="name"
                            class="form-control"
                            required
                        >

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Email
                        </label>

                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            required
                        >

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Password
                        </label>

                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            required
                        >

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Language
                        </label>

                        <select
                            name="language"
                            class="form-select"
                        >

                            <option value="en">
                                English
                            </option>

                            <option value="te">
                                Telugu
                            </option>

                        </select>

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Location
                        </label>

                        <input
                            type="text"
                            name="location"
                            class="form-control"
                            placeholder="Example: Vijayawada"
                        >

                    </div>


                    <button
                        type="submit"
                        class="btn btn-success w-100"
                    >
                        Register
                    </button>

                </form>


                <p class="text-center mt-3">

                    Already have an account?

                    <a href="{{ url_for('login') }}">
                        Login
                    </a>

                </p>

            </div>

        </div>

    </div>

</div>

{% endblock %}
