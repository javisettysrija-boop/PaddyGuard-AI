{% extends "base.html" %}


{% block content %}

<div class="container py-4">

    <h2 class="dashboard-title">
        🔬 Paddy Disease Detection
    </h2>

    <p class="text-muted">
        Upload a clear image of a paddy leaf.
    </p>


    <div class="upload-area mt-4">

        <form
            id="uploadForm"
            method="POST"
            enctype="multipart/form-data"
        >

            <div class="mb-3">

                <h4>
                    Upload Paddy Leaf Image
                </h4>

                <p class="text-muted">
                    Supported formats: JPG, JPEG, PNG
                </p>

            </div>


            <input
                type="file"
                id="image"
                name="image"
                class="form-control mb-3"
                accept=".jpg,.jpeg,.png"
                required
            >


            <img
                id="imagePreview"
                class="img-fluid rounded mb-3 d-none"
                style="max-height: 300px;"
                alt="Image preview"
            >


            <button
                type="submit"
                class="btn btn-success"
            >
                Analyze Paddy Leaf
            </button>

        </form>

    </div>

</div>

{% endblock %}
