<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PaddyGuard AI - Weather</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body>

<header class="topbar">

    <div class="logo">
        🌾 PaddyGuard AI
    </div>

    <nav>

        <a href="/dashboard">
            Dashboard
        </a>

        <a href="/">
            Predict
        </a>

        <a href="/history">
            History
        </a>

        <a href="/alerts">
            Alerts
        </a>

        <a href="/logout">
            Logout
        </a>

    </nav>

</header>


<main class="dashboard">

    <div class="welcome">

        <h1>
            🌦 Paddy Weather
        </h1>

        <p>
            Weather information for crop monitoring.
        </p>

    </div>


    <div class="dashboard-grid">


        <div class="dashboard-card">

            <div class="card-icon">
                🌡️
            </div>

            <h2>
                Temperature
            </h2>

            <p>
                {{ temperature or "Not available" }}
            </p>

        </div>


        <div class="dashboard-card">

            <div class="card-icon">
                💧
            </div>

            <h2>
                Humidity
            </h2>

            <p>
                {{ humidity or "Not available" }}
            </p>

        </div>


        <div class="dashboard-card">

            <div class="card-icon">
                🌧️
            </div>

            <h2>
                Rainfall
            </h2>

            <p>
                {{ rainfall or "Not available" }}
            </p>

        </div>


    </div>

</main>

</body>

</html>
