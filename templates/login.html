<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PaddyGuard AI - Login</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body>

<div class="auth-container">

    <div class="auth-box">

        <h1>🌾 PaddyGuard AI</h1>

        <h2>Login</h2>

        <form
            action="/login"
            method="POST"
        >

            <label>
                Email
            </label>

            <input
                type="email"
                name="email"
                required
            >

            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p>
            Don't have an account?
            <a href="/register">
                Register
            </a>
        </p>

    </div>

</div>

</body>

</html>
